    <div class="form-group" style="display: none;">

    </div>

    <div class="form-group">
      <label for="projectTechnology">Project Technology</label>
      <select id="projectTechnology" class="form-control" [(ngModel)]="projectTechnology" name="projectTechnology">
        <option value="" disabled selected>Select</option>
        <option value="AspxNet">Web Forms [Asp.Net]</option>
        <option value="aspnetmvc">MVC</option>
        <option value="angular">Angular</option>
        <option value="WebAPI">WebAPI</option>
        <option value="asp">asp</option>
        <!-- Add more options as needed -->
      </select>
    </div>

<div class="form-group">
  <label for="feature">Feature</label>
  <select id="feature" class="form-control" [(ngModel)]="feature" (ngModelChange)="onFeatureChange($event)" name="feature">
    <option value="" disabled selected>Select</option>
    <option value="ShowCodeImprovements">Show Code Improvements</option>
    <option value="ShowControlDetails">Show Control Details</option>
    <option value="GenerateProjectDiagram">Generate Project Diagram</option>
    <option value="GenerateFeatureandPage">Show Page Feature </option> 
  </select>
</div>




    <!-- Action Buttons -->
     <button type="button" class="btn btn-primary button-spacing" (click)="genrateSummary()">Show Result</button>
    
    <!-- Code Improvement grid GRID  -->
<div [ngClass]="{'hidden': activeDiv !== 'divCodeImprovement'}">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" multiTemplateDataRows>


  <ng-container matColumnDef="methodName">
    <th mat-header-cell *matHeaderCellDef> Method Name </th>
    <td mat-cell *matCellDef="let element"> {{element.methodName}} </td>
  </ng-container>

  <ng-container matColumnDef="severity">
    <th mat-header-cell *matHeaderCellDef> Severity </th>
    <td mat-cell *matCellDef="let element"> {{element.severity}} </td>
  </ng-container>

 
  <ng-container matColumnDef="improvement">
    <th mat-header-cell *matHeaderCellDef> Improvement </th>
    <td mat-cell *matCellDef="let element"> {{element.improvement}} </td>
  </ng-container>

 
  <ng-container matColumnDef="suggestion">
    <th mat-header-cell *matHeaderCellDef> Suggestion </th>
    <td mat-cell *matCellDef="let element"> {{element.suggestion}} </td>
  </ng-container>

  

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef> Action </th>
    <td mat-cell *matCellDef="let element">
      <button mat-button color="primary" class="btn btn-primary button-spacing"  (click)="getCodeImprovementDetail(element)">Download Detail</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

</div>

<div [ngClass]="{'hidden': activeDiv !== 'divControlDetails'}">

   <table mat-table [dataSource]="controlDataSource" class="mat-elevation-z29" multiTemplateDataRows>

  <ng-container matColumnDef="controlName">
    <th mat-header-cell *matHeaderCellDef> Control Name  </th>
    <td mat-cell *matCellDef="let element"> {{element.ControlName}} </td>
  </ng-container>

  <ng-container matColumnDef="count">
    <th mat-header-cell *matHeaderCellDef> Count </th>
    <td mat-cell *matCellDef="let element"> {{element.Count}} </td>
    </ng-container>

  <tr mat-header-row *matHeaderRowDef="controlDisplayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: controlDisplayedColumns;"></tr>
</table>

</div>


  </form>
 
 
</div>
