<mat-toolbar class="app-navbar">
  <!-- Logo / App Name -->
  <span class="app-logo" style="cursor: pointer;" (click)="goToDashboard()">
    <img src="/yash-logo-new.svg" alt="Yash Technologies Logo" height="50" />
  </span>

  <!-- Spacer pushes menus to right -->
  <span class="spacer"></span>

  <!-- Menu Items -->
  <nav class="nav-links">
  <a mat-button routerLink="/dashboard" routerLinkActive="active-link">Home</a>
    <a mat-button routerLink="/about" routerLinkActive="active-link">About Us</a>
  <a mat-button routerLink="/contact" routerLinkActive="active-link">Contact Us</a>
    <a mat-button routerLink="/settings" routerLinkActive="active-link">Settings</a>
  </nav>

  <!-- Profile Menu -->
  <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="profile-btn">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #profileMenu="matMenu">
    <button mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
